# Example Nginx reverse proxy + TLS for OTP Board.
# Save as /etc/nginx/sites-available/otp-board and symlink into sites-enabled,
# then `sudo certbot --nginx -d your.domain.example`.

server {
    listen 80;
    server_name your.domain.example;

    # ACME challenge for certbot (HTTP-01)
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Redirect everything else to HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name your.domain.example;

    ssl_certificate     /etc/letsencrypt/live/your.domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The OTP Board server (run behind PM2 / systemd on localhost)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
