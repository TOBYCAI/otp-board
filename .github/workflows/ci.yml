name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-core:
    name: Shared JS core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run shared core unit tests
        run: node --test shared/js/

  contract:
    name: Contract (schema + rules + core) validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate shared contract
        run: node scripts/validate-contract.js
